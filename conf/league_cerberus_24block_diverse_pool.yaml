# Variant of league_cerberus_24block.yaml: larger, more diverse opponent pool
# (pool_size 10->20) and less forced anchor-focus (anchor_floor 0.15->0.08),
# to reduce overfitting to the fixed anchors / recent self-play snapshots.
# Same starting point (Cerberus 3.1) and same anchor list as the baseline.
defaults:
- override hydra/job_logging: colorlog
- override hydra/hydra_logging: colorlog

hydra:
  run:
    dir: ./outputs/${now:%m-%d}/${now:%H-%M-%S}

name: league_cerberus_24block_diverse_pool
project: Lux_AI_2021_league
entity: null
group: cerberus_24block_diverse_pool

act_space: BasicActionSpace
obs_space: FixedShapeContinuousObsV2
obs_space_kwargs: {}
reward_space: GameResultReward
reward_space_kwargs: {}

total_steps: 500000
num_actors: 2
n_actor_envs: 16
unroll_length: 16
batch_size: 4
discounting: 0.999
seed: 42

model_arch: conv_model
n_blocks: 24
hidden_dim: 128
embedding_dim: 32
n_merge_layers: 1
normalize: False
sum_player_embeddings: False
use_index_select: False
rescale_value_input: True
rescale_se_input: True
kernel_size: 5

optimizer_class: Adam
optimizer_kwargs:
  lr: 1e-5
  eps: 0.0003
min_lr_mod: 1.0

entropy_cost: 2e-6
baseline_cost: 1.
teacher_kl_cost: 0.0
teacher_baseline_cost: 0.0
lmb: 0.9
reduction: sum

use_teacher: False
teacher_load_dir: ${hydra:runtime.cwd}/internal_testing/hall_of_fame/11-24_12-56-23_062179520_must_research/lux_ai/rl_agent
teacher_checkpoint_file: 062179520_weights.pt

league:
  enabled: true
  # --- changed from baseline (pool_size: 10) ---
  pool_size: 20
  anchors:
  - ${hydra:runtime.cwd}/internal_testing/hall_of_fame/11-24_12-56-23_062179520_must_research
  - ${hydra:runtime.cwd}/internal_testing/hall_of_fame/10-10_11-18-12_28576448
  - ${hydra:runtime.cwd}/internal_testing/internal_agents/10-02_11-29-02_20000192
  - ${hydra:runtime.cwd}/internal_testing/internal_agents/10-08_17-35-45_20000192
  initial_members: []
  anchor_eval_enabled: True
  anchor_eval_every_n_games: 500
  anchor_eval_n_seeds: 3
  anchor_eval_map_sizes: [12, 16, 24, 32]
  anchor_eval_parallel_games: 8
  anchor_eval_at_start: True
  mirror_frac: 0.5
  snapshot_interval_updates: 500
  priority: pfsp
  alpha: 0.5
  eps_uniform: 0.1
  # --- changed from baseline (anchor_floor: 0.15) ---
  anchor_floor: 0.08
  anchor_report_every_n_games: 100
  winrate_lambda: 0.1
  winrate_init: 0.5
  max_loaded_opponents: 8
  opponent_sample: true

actor_device: cuda:0
learner_device: cuda:0
model_log_freq: 100
sharing_strategy: file_system
disable_wandb: False
debug: False

load_dir: ${hydra:runtime.cwd}/internal_testing/hall_of_fame/11-24_12-56-23_062179520_must_research/lux_ai/rl_agent
checkpoint_file: 062179520_weights.pt
weights_only: True
n_value_warmup_batches: 0
