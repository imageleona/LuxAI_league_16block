# Controlled recovery preset for the Team G Haruto 16-block checkpoint.
#
# This file is intentionally safe as a standalone final candidate. The staged
# runner overrides one group of settings at a time to identify which changes are
# actually useful. All output must be directed outside this repository through
# LUX_RECOVERY_OUTPUT_ROOT.
defaults:
- override hydra/job_logging: colorlog
- override hydra/hydra_logging: colorlog

hydra:
  run:
    dir: ${oc.env:LUX_RECOVERY_OUTPUT_ROOT}/${name}/${now:%Y-%m-%d_%H-%M-%S}

name: recovery_16block
project: Lux_AI_2021_league
entity: null
group: recovery_16block

act_space: BasicActionSpace
obs_space: FixedShapeContinuousObsV2
obs_space_kwargs: {}
reward_space: GameResultReward
reward_space_kwargs: {}

total_steps: 200000
num_actors: 2
n_actor_envs: 16
unroll_length: 16
batch_size: 4
discounting: 0.999
seed: 42

model_arch: conv_model
n_blocks: 16
hidden_dim: 96
embedding_dim: 32
adaptive_embedding_dims: True
adaptive_embedding_max_values: 4
n_merge_layers: 1
normalize: False
sum_player_embeddings: False
use_index_select: True
rescale_value_input: True
rescale_se_input: True
kernel_size: 5

optimizer_class: Adam
optimizer_kwargs:
  lr: 1.0e-6
  eps: 0.0003
min_lr_mod: 0.01

entropy_cost: 2.0e-4
baseline_cost: 1.0
teacher_kl_cost: 0.02
teacher_baseline_cost: 0.0
lmb: 0.8
reduction: sum

use_teacher: True
teacher_load_dir: C:/Users/_s2111724/2026_summer_camp/LuxAI/LuxAI_league_16block/internal_testing/hall_of_fame/11-24_12-56-23_062179520_must_research/lux_ai/rl_agent
teacher_checkpoint_file: 062179520_weights.pt

league:
  enabled: True
  pool_size: 10
  anchors:
  - C:/Users/_s2111724/2026_summer_camp/LuxAI/LuxAI_league_16block/league_agents/haruto_16block
  - C:/Users/_s2111724/2026_summer_camp/LuxAI/LuxAI_league_16block/internal_testing/hall_of_fame/11-24_12-56-23_062179520_must_research
  - C:/Users/_s2111724/2026_summer_camp/LuxAI/LuxAI_league_16block/internal_testing/hall_of_fame/10-10_11-18-12_28576448
  - C:/Users/_s2111724/2026_summer_camp/LuxAI/LuxAI_league_16block/internal_testing/internal_agents/10-02_11-29-02_20000192
  - C:/Users/_s2111724/2026_summer_camp/LuxAI/LuxAI_league_16block/internal_testing/internal_agents/10-08_17-35-45_20000192
  initial_members: []
  mirror_frac: 0.5
  snapshot_interval_updates: 500
  priority: pfsp
  alpha: 0.5
  eps_uniform: 0.1
  anchor_floor: 0.12
  anchor_report_every_n_games: 100
  winrate_lambda: 0.1
  winrate_init: 0.5
  max_loaded_opponents: 8

  # Fixed paired schedule: 6 seeds x 4 map sizes x 2 seats = 48 games/anchor.
  anchor_eval_enabled: True
  anchor_eval_every_n_games: 500
  anchor_eval_n_seeds: 6
  anchor_eval_map_sizes: [12, 16, 24, 32]
  anchor_eval_parallel_games: 8
  anchor_eval_at_start: True
  anchor_eval_save_best: True
  anchor_eval_best_min_delta: 0.0
  anchor_eval_promote_best: False
  anchor_eval_promotion_min_delta: 0.02

  # Raw training-win-rate promotion is disabled in the controlled ladder.
  winrate_admit_threshold: 0.0
  winrate_admit_reference: haruto_16block
  winrate_admit_window: 50
  winrate_admit_cooldown_updates: 500
  exploiter_target_winrate: 0.0

  opponent_sample: True
  opponent_inference_mode: raw
  opponent_use_collision_detection: True
  opponent_must_research: True
  opponent_can_build_carts: False
  opponent_data_augmentations: []

actor_device: cuda:0
learner_device: cuda:0
sharing_strategy: file_system
model_log_freq: 100
checkpoint_freq: 60
disable_wandb: True
debug: False

# The full Team G checkpoint supplies Adam's moments. Its scheduler finished at
# 1e-8, so the recovery run deliberately starts a fresh conservative schedule.
load_dir: C:/Users/_s2111724/2026_summer_camp/LuxAI/Lux-Design-S1-team-g/development/haruto/haruto_top_16block_40k
checkpoint_file: 40000.pt
weights_only: True
resume_saved_config: False
load_optimizer_state: True
load_scheduler_state: False
resume_training_counters: False
n_value_warmup_batches: 0
